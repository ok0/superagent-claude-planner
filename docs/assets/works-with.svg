<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="t d">
  <title id="t">superagent-claude-planner and superagent-claude</title>
  <desc id="d">Two tools side by side, each complete on its own. superagent-claude-planner turns one change into an approved plan and publishes one GitHub issue per repository. superagent-claude takes an issue or mention from an allowed person, works in its own worktree, and replies or opens a pull request. An optional dashed link through GitHub issues shows that the planner's issues can feed the agent.</desc>
  <style>
    :root {
      --bg: #fbfaf8;
      --lane: #f3f1ed;
      --node: #ffffff;
      --ink: #1c1917;
      --muted: #6b645c;
      --line: #a8a29e;
      --accent: #c2410c;
      --face: system-ui, -apple-system, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141210;
        --lane: #1c1a17;
        --node: #0f0e0c;
        --ink: #ece8e3;
        --muted: #a39d95;
        --line: #57534e;
        --accent: #fb923c;
      }
    }
    .bg { fill: var(--bg); stroke: var(--line); }
    .lane { fill: var(--lane); }
    .node { fill: var(--node); stroke: var(--ink); stroke-width: 1.25; }
    .main { fill: none; stroke: var(--accent); stroke-width: 1.75; }
    .side { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .tip { fill: var(--accent); }
    .tip-side { fill: var(--line); }
    .tag { fill: var(--bg); stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
    text { font-family: var(--face); fill: var(--ink); }
    .lh { font-size: 15px; font-weight: 700; }
    .ls { font-size: 12px; fill: var(--muted); }
    .h { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; fill: var(--muted); }
    .cap { font-size: 12px; fill: var(--muted); font-style: italic; text-anchor: middle; }
    .th { font-size: 12px; font-weight: 600; fill: var(--muted); text-anchor: middle; }
    .ts { font-size: 11px; fill: var(--muted); text-anchor: middle; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon class="tip" points="0,0 10,5 0,10"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon class="tip-side" points="0,0 10,5 0,10"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="100%" height="100%" rx="8" fill="#fbfaf8"/>

  <!-- Planner lane -->
  <rect class="lane" x="16" y="16" width="400" height="298" rx="4"/>
  <text class="lh" x="40" y="44">superagent-claude-planner</text>
  <text class="ls" x="40" y="62">Plans one change across repositories</text>

  <rect class="node" x="40" y="84" width="352" height="44" rx="4"/>
  <text class="h" x="56" y="103">Describe one change</text>
  <text class="s" x="56" y="119">in Claude Code</text>
  <path class="main" d="M216,128 V146" marker-end="url(#a)"/>

  <rect class="node" x="40" y="148" width="352" height="44" rx="4"/>
  <text class="h" x="56" y="167">Approve the plan</text>
  <text class="s" x="56" y="183">one contract and a merge order</text>
  <path class="main" d="M216,192 V210" marker-end="url(#a)"/>

  <rect class="node" x="40" y="212" width="352" height="44" rx="4"/>
  <text class="h" x="56" y="231">Publish GitHub issues</text>
  <text class="s" x="56" y="247">one per repository</text>

  <text class="cap" x="216" y="290">Works on its own</text>

  <!-- Agent lane -->
  <rect class="lane" x="544" y="16" width="400" height="298" rx="4"/>
  <text class="lh" x="568" y="44">superagent-claude</text>
  <text class="ls" x="568" y="62">Does the work in each repository</text>

  <rect class="node" x="568" y="84" width="352" height="44" rx="4"/>
  <text class="h" x="584" y="103">Take an issue or mention</text>
  <text class="s" x="584" y="119">from an allowed person</text>
  <path class="main" d="M744,128 V146" marker-end="url(#a)"/>

  <rect class="node" x="568" y="148" width="352" height="44" rx="4"/>
  <text class="h" x="584" y="167">Work in its own worktree</text>
  <text class="s" x="584" y="183">one session per ticket</text>
  <path class="main" d="M744,192 V210" marker-end="url(#a)"/>

  <rect class="node" x="568" y="212" width="352" height="44" rx="4"/>
  <text class="h" x="584" y="231">Reply or open a pull request</text>
  <text class="s" x="584" y="247">in the original conversation</text>

  <text class="cap" x="744" y="290">Works on its own</text>

  <!-- Optional link -->
  <path class="side" d="M392,234 H480 V106 H566" marker-end="url(#b)"/>
  <rect class="tag" x="428" y="146" width="104" height="44" rx="4"/>
  <text class="th" x="480" y="165">GitHub issues</text>
  <text class="ts" x="480" y="181">optional</text>
</svg>
