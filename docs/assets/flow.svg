<svg xmlns="http://www.w3.org/2000/svg" width="960" height="766" viewBox="0 0 960 766" role="img" aria-labelledby="t d">
  <title id="t">issuecrew-planner flow</title>
  <desc id="d">Three lanes: you in Claude Code, the planner session, and the deterministic issuecrew-planner CLI. You describe one change; the session reads the repositories, asks you to choose a strategy for breaking changes, and drafts a plan. The CLI saves, validates and renders it with a plan hash. You approve that hash, and only then does the CLI publish one GitHub issue per repository for issuecrew, sharing one contract and a merge order.</desc>
  <style>
    :root {
      --bg: #fbfaf8; --lane: #f3f1ed; --node: #ffffff;
      --ink: #1c1917; --muted: #6b645c; --line: #a8a29e;
      --accent: #d4a72c; --accent-ink: #7d4e00; --accent-bg: #fff8c5; --on-accent: #1c1917;
      --face: system-ui, -apple-system, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117; --lane: #1c2128; --node: #161b22;
        --ink: #e6edf3; --muted: #8b949e; --line: #30363d;
        --accent: #e3b341; --accent-ink: #e3b341; --accent-bg: rgba(187, 128, 9, 0.15); --on-accent: #0d1117;
      }
    }
    .bg { fill: var(--bg); stroke: var(--line); }
    .lane { fill: var(--lane); }
    .sand { fill: var(--lane); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 7 5; }
    .rule { stroke: var(--line); stroke-width: 1; }
    .node { fill: var(--node); stroke: var(--ink); stroke-width: 1.25; }
    .alt { fill: none; stroke: var(--line); stroke-width: 1.25; stroke-dasharray: 4 3; }
    .main { fill: none; stroke: var(--accent); stroke-width: 2.25; }
    .side { fill: none; stroke: var(--line); stroke-width: 1.25; stroke-dasharray: 4 3; }
    .tip { fill: var(--accent); }
    .tip-side { fill: var(--line); }
    .badge { fill: var(--accent); }
    text { font-family: var(--face); fill: var(--ink); }
    .lh { font-size: 15px; font-weight: 700; }
    .ls { font-size: 12px; fill: var(--muted); }
    .num { font-size: 11px; font-weight: 700; fill: var(--on-accent); text-anchor: middle; }
    .h { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; fill: var(--muted); }
    .ah { font-size: 13px; font-weight: 600; fill: var(--muted); }
    .e { font-size: 12px; fill: var(--accent-ink); }
    .code { font-family: var(--mono); font-size: 11.5px; fill: var(--muted); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <polygon class="tip" points="0,0 10,5 0,10"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon class="tip-side" points="0,0 10,5 0,10"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="100%" height="100%" rx="8" fill="#fbfaf8"/>

  <!-- Lanes -->
  <rect class="lane" x="16" y="16" width="288" height="734" rx="4"/>
  <rect class="sand" x="316" y="16" width="312" height="734" rx="4"/>
  <rect class="lane" x="640" y="16" width="304" height="734" rx="4"/>

  <text class="lh" x="36" y="44">You</text>
  <text class="ls" x="36" y="62">in Claude Code</text>
  <text class="lh" x="336" y="44">Planner session</text>
  <text class="ls" x="336" y="62">the plan Skill, guard hook on</text>
  <text class="lh" x="660" y="44">issuecrew-planner</text>
  <text class="ls" x="660" y="62">deterministic CLI, the only GitHub writer</text>
  <line class="rule" x1="36" y1="76" x2="284" y2="76"/>
  <line class="rule" x1="336" y1="76" x2="608" y2="76"/>
  <line class="rule" x1="660" y1="76" x2="924" y2="76"/>

  <!-- 1 request -->
  <rect class="node" x="36" y="96" width="248" height="56" rx="2"/>
  <text class="h" x="52" y="120">Change request</text>
  <text class="s" x="52" y="138">one change that spans several repos</text>
  <circle class="badge" cx="36" cy="96" r="10"/><text class="num" x="36" y="100">1</text>

  <!-- 2 read repos -->
  <rect class="node" x="344" y="96" width="256" height="56" rx="2"/>
  <text class="h" x="360" y="120">Read the repositories</text>
  <text class="s" x="360" y="138">from the catalog, or asks you which</text>
  <circle class="badge" cx="344" cy="96" r="10"/><text class="num" x="344" y="100">2</text>
  <line class="main" x1="284" y1="124" x2="342" y2="124" marker-end="url(#a)"/>

  <!-- 3 breaking change -->
  <rect class="node" x="344" y="192" width="256" height="56" rx="2"/>
  <text class="h" x="360" y="216">Breaking change check</text>
  <text class="s" x="360" y="234">something removed or renamed?</text>
  <circle class="badge" cx="344" cy="192" r="10"/><text class="num" x="344" y="196">3</text>
  <line class="main" x1="472" y1="152" x2="472" y2="190" marker-end="url(#a)"/>

  <rect class="alt" x="36" y="192" width="248" height="56" rx="2"/>
  <text class="ah" x="52" y="216">You pick the strategy</text>
  <text class="s" x="52" y="234">(A) staged or (B) at-once</text>
  <line class="side" x1="342" y1="220" x2="286" y2="220" marker-start="url(#b)" marker-end="url(#b)"/>
  <text class="s" x="36" y="270">Recorded in the plan, never guessed.</text>

  <!-- 4 draft -->
  <rect class="node" x="344" y="288" width="256" height="56" rx="2"/>
  <text class="h" x="360" y="312">Draft the plan</text>
  <text class="s" x="360" y="330">one contract, one issue per repo</text>
  <circle class="badge" cx="344" cy="288" r="10"/><text class="num" x="344" y="292">4</text>
  <line class="main" x1="472" y1="248" x2="472" y2="286" marker-end="url(#a)"/>

  <!-- 5 save + validate -->
  <rect class="node" x="664" y="288" width="256" height="56" rx="2"/>
  <text class="h" x="680" y="312">save, validate</text>
  <text class="s" x="680" y="330">plan.json checked against the schema</text>
  <circle class="badge" cx="664" cy="288" r="10"/><text class="num" x="664" y="292">5</text>
  <line class="main" x1="600" y1="316" x2="662" y2="316" marker-end="url(#a)"/>

  <!-- 6 show -->
  <rect class="node" x="664" y="384" width="256" height="56" rx="2"/>
  <text class="h" x="680" y="408">show</text>
  <text class="s" x="680" y="426">renders every issue, prints the hash</text>
  <circle class="badge" cx="664" cy="384" r="10"/><text class="num" x="664" y="388">6</text>
  <line class="main" x1="792" y1="344" x2="792" y2="382" marker-end="url(#a)"/>

  <!-- 7 review -->
  <rect class="node" x="36" y="384" width="248" height="56" rx="2"/>
  <text class="h" x="52" y="408">Review and approve</text>
  <text class="s" x="52" y="426">the issues exactly as rendered</text>
  <circle class="badge" cx="36" cy="384" r="10"/><text class="num" x="36" y="388">7</text>
  <line class="main" x1="664" y1="412" x2="286" y2="412" marker-end="url(#a)"/>
  <text class="e" x="336" y="402">issues + plan hash</text>

  <!-- 8 approve -->
  <rect class="node" x="664" y="480" width="256" height="56" rx="2"/>
  <text class="h" x="680" y="504">approve --hash</text>
  <text class="s" x="680" y="522">approval bound to that hash</text>
  <circle class="badge" cx="664" cy="480" r="10"/><text class="num" x="664" y="484">8</text>
  <polyline class="main" points="160,440 160,508 662,508" marker-end="url(#a)"/>
  <text class="e" x="336" y="498">approve this hash</text>

  <!-- 9 publish -->
  <rect class="node" x="664" y="576" width="256" height="56" rx="2"/>
  <text class="h" x="680" y="600">publish --approve-hash</text>
  <text class="s" x="680" y="618">idempotent, safe to re-run</text>
  <circle class="badge" cx="664" cy="576" r="10"/><text class="num" x="664" y="580">9</text>
  <line class="main" x1="792" y1="536" x2="792" y2="574" marker-end="url(#a)"/>

  <rect class="alt" x="344" y="560" width="256" height="56" rx="2"/>
  <text class="ah" x="360" y="584">Plan edited after review</text>
  <text class="s" x="360" y="602">new hash, old approval void</text>
  <line class="side" x1="600" y1="588" x2="662" y2="604" marker-end="url(#b)"/>

  <!-- 10 issues -->
  <rect class="node" x="664" y="672" width="256" height="56" rx="2"/>
  <text class="h" x="680" y="696">GitHub issues</text>
  <text class="s" x="680" y="714">for issuecrew, in merge order</text>
  <line class="main" x1="792" y1="632" x2="792" y2="670" marker-end="url(#a)"/>

  <!-- Session guard rails -->
  <line class="rule" x1="344" y1="640" x2="600" y2="640"/>
  <text class="s" x="344" y="662">the model has no GitHub write path</text>
  <text class="code" x="344" y="684">guard hook: no gh, no GitHub API</text>
  <text class="code" x="344" y="702">Bash: read-only + issuecrew-planner</text>
  <text class="code" x="344" y="720">planner token: never in Bash</text>

</svg>
