name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0
        required: true
        type: string
permissions: {}
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ inputs.tag || github.ref }}', persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: 24, package-manager-cache: false, registry-url: 'https://registry.npmjs.org' }
      - name: install npm
        run: npm install --global npm@11.6.2
      - name: install pnpm
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: install dependencies
        run: pnpm install --frozen-lockfile
      - name: verify tag matches version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "tag $RELEASE_TAG does not match package.json version $version" >&2
            exit 1
          fi
      - name: check
        run: pnpm check
      - name: release check
        run: pnpm release:check
      - name: check published
        id: published
        run: |
          if npm view "superagent-claude-planner@${RELEASE_TAG#v}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: publish
        if: steps.published.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
